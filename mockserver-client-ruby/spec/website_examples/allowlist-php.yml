# Website accordions whose PHP tab is allowed to differ from the REST API tab.
# Same format and rules as allowlist.yml (the Ruby tabs): key, the finding
# it accepts (status), a reason, and the digest the check prints. Any other
# finding fails the check, and so does an entry that no longer matches.
#   ruby spec/website_examples/check_website_examples.rb --lang php --verbose

# --- Same as the Ruby tab ---
mock_server/_includes/grpc_mocking.html#button_grpc_record_replay:
  status: differs
  digest: d7e5cdb560d3
  reason: PHP replays the expectations it retrieved; the REST API tab saves them to
    a file and uploads that file.
mock_server/_includes/load_scenario_code_examples.html#button_load_lifecycle:
  status: differs
  digest: d453933386c4
  reason: PHP also clears the scenario registry at the end; the REST API tab stops
    at stop.
mock_server/_includes/load_scenario_code_examples.html#button_load_rate_soak:
  status: differs
  digest: 2a7637c5dc46
  reason: PHP also stops the scenario after starting it; the REST API tab registers
    and starts it.
mock_server/_includes/load_scenario_code_examples.html#button_load_vu_ramp:
  status: differs
  digest: 4f98da7d9e08
  reason: PHP also stops the scenario after starting it; the REST API tab registers
    and starts it.
mock_server/_includes/openapi_request_matcher_code_examples.html#button_match_by_inline_openapi_json:
  status: rest_invalid_json
  digest: 3fda2f398375
  reason: One REST API tab splices the spec in with a shell backtick cat, which is
    not JSON as written; PHP reads the spec from a file.
mock_server/_includes/openapi_request_matcher_code_examples.html#button_match_by_inline_openapi_yaml:
  status: differs
  digest: d8d35a121344
  reason: PHP reads the YAML spec from a file; the REST API tab inlines it (and adds
    an expectation id).
? mock_server/_includes/stateful_scenarios.html#external_trigger_mdash_flip_a_dependency_from_healthy_to_down_on_demand_from_your_test_harness
: status: differs
  digest: 9e853dd5de24
  reason: PHP, like the Java tab, shows only the trigger call; the REST API tab also
    registers the expectations it relies on.
? mock_server/_includes/stateful_scenarios.html#timed_auto_transition_mdash_model_a_deployment_that_automatically_completes_after_1_second
: status: differs
  digest: 5135518949b0
  reason: PHP, like the Java tab, shows only the scenario call; the REST API tab also
    registers the expectations it relies on.
mock_server/contract_testing.html#button_pact_full_workflow:
  status: differs
  digest: 81612ff860c6
  reason: The REST API tab adds an expectation id and a JSON-object body and reads
    the contract from a file; PHP follows the Java tab and passes the exported contract
    on.
mock_server/load_injection.html#button_load_step_checks:
  status: differs
  digest: 4c663b38bea8
  reason: PHP also stops the scenario after starting it; the REST API tab registers
    and starts it.
mock_server/load_injection.html#in_run_thresholds_fail_the_run_on_a_latency_or_error_budget_breach:
  status: differs
  digest: 31686a71eb8b
  reason: PHP reads the status once; the REST API tab polls it in a shell loop.
mock_server/mock_openid_connect_provider.html#button_create_oidc_provider:
  status: differs
  digest: 665743e62ea3
  reason: The REST API tab shows a defaults call and then a configured call; PHP shows
    the configured one.
mock_server/using_openapi.html#button_open_api_inline_json_specification:
  status: differs
  digest: 9cb4ef347513
  reason: PHP reads the spec from a file; the REST API tab splices it in with a shell
    backtick command.
mock_server/using_openapi.html#button_wsdl_inline:
  status: differs
  digest: b996b93a35f3
  reason: The REST API tab abbreviates the WSDL document with "..."; PHP sends it
    in full.

# --- Intentional: the tab shows the same feature another way ---
mock_server/_includes/stateful_scenarios.html#rest_api_reference_mdash_inspect_and_control_scenarios_with_curl:
  status: differs
  digest: 5f0cf6f1da06
  reason: PHP makes the same calls but lists all scenarios last; the REST API tab
    lists them first.
mock_server/load_injection.html#cross_step_capture_login_capture_a_token_reuse_it:
  status: differs
  digest: 77fe6b4910fb
  reason: PHP sends the login body as a JSON string; the REST API tab as a JSON object.
    A load step sends the same bytes either way.
mock_server/load_injection.html#register_start_read_status_then_stop_a_ramp_then_hold_scenario:
  status: differs
  digest: 4dc640b80414
  reason: PHP reads the scenario status and stops it with its own calls; the REST
    API tab reads and stops by path (same calls, other order).
mock_server/running_tests_in_parallel.html#button_parallel_tests_unique_session_id:
  status: differs
  digest: bbf0424ebcc8
  reason: PHP generates a fresh session id with random_bytes; the REST API tab shows
    a fixed one.
mock_server/using_openapi.html#button_open_api_inline_yaml_specification:
  status: differs
  digest: 242421c65f1a
  reason: The PHP heredoc drops the spec's final newline; the YAML is otherwise the
    REST API tab's.

# --- The check cannot run it ---
mock_server/CORS_support.html#button_enabled_permissive_cors_for_all_response:
  status: raised
  digest: 3069e347b091
  reason: PHP starts a server with the CORS properties (the binary launcher, which
    would download the server); the REST API tab sets them on a running server.
mock_server/CORS_support.html#button_enabled_permissive_cors_for_control_plane_api:
  status: raised
  digest: 3069e347b091
  reason: PHP starts a server with the CORS properties (the binary launcher, which
    would download the server); the REST API tab sets them on a running server.
mock_server/HTTPS_TLS.html#button_client_mtls_connection:
  status: sent_nothing
  digest: bb5bb1b3a774
  reason: Connects over mutual TLS with certificate files at placeholder paths (/path/to/...);
    the check runs a plain HTTP capture server.
mock_server/mockserver_clients.html#button_client_create_expectation_over_tls:
  status: raised
  digest: 1816e187823d
  reason: Connects over TLS; the check runs a plain HTTP capture server, so the TLS
    handshake never completes.
mock_server/using_openapi.html#button_wsdl_file:
  status: differs
  digest: 3d52ad5ffb07
  reason: PHP reads the WSDL from a placeholder path (/path/to/...), so it sends no
    body; the REST API tab sends it from a file with -d @.

