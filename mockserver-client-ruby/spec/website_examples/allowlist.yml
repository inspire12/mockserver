# Website accordions whose Ruby tab is allowed to differ from the REST API tab.
# Key: page path#accordion button id (or its title when it has no id).
# status: the finding this entry accepts (not_compared, differs, sent_nothing,
# raised, rest_unparseable, rest_quoting, rest_invalid_json). digest: what the
# block sends (or, for not_compared, its code), as the check prints it; a
# block that starts sending something else fails until it is reviewed again.
# Any other finding fails the check, and so does an entry that no longer
# matches its finding.

